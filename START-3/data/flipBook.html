  <!-- Auto-hide desktop and mobile fullscreen prompts after 3 seconds -->
  <script type="text/javascript">
    (function watchAndHidePrompts() {
      var nodes = document.querySelectorAll('.clickToRead, .miniFullscreen, #miniFullscreen');
      Array.prototype.forEach.call(nodes, function (el) {
        if (el && !el.getAttribute('data-auto-hide-scheduled')) {
          el.setAttribute('data-auto-hide-scheduled', '1');
          setTimeout(function () {
            if (!el || !el.parentNode) return;
            try {
              el.style.transition = 'opacity 300ms ease';
              el.style.opacity = '0';
              setTimeout(function(){ if (el && el.parentNode) el.parentNode.removeChild(el); }, 350);
            } catch (e) {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }
          }, 3000);
        }
      });
      setTimeout(watchAndHidePrompts, 300);
    })();

  <!-- Inline Prev/Next just above gp-row#gpUwRogPvr -->
  <style>
    #__inline_nav_gpUwRogPvr { display: flex; gap: 16px; justify-content: center; align-items: center; margin: 8px 0; }
    #__inline_nav_gpUwRogPvr .inline-nav-btn {
      -webkit-tap-highlight-color: transparent; cursor: pointer;
      width: 36px; height: 36px; border-radius: 18px; border: 0; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; line-height: 1; color: #fff;
      background: rgba(0,0,0,0.65); box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    #__inline_nav_gpUwRogPvr .inline-nav-btn:active { transform: scale(0.96); }
  </style>
  <script type="text/javascript">
    (function inlineNavAboveGpRow(){
      var targetId = 'gpUwRogPvr';
      function ready(){
        return document.getElementById(targetId) &&
               window.BookInfo && typeof BookInfo.getCurrentPageIndex==='function' &&
               typeof window.gotoPageFun==='function';
      }
      function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
      function nav(dir, ev){
        try{ if(ev){ ev.preventDefault(); ev.stopPropagation(); } }catch(e){}
        try{
          var cur = (BookInfo.getCurrentPageIndex && BookInfo.getCurrentPageIndex()) || 1;
          var total = (window.bookConfig && window.bookConfig.totalPageCount) || 1;
          if(window.bookType===1 && window.bookConfig && window.bookConfig.SingleModeBanFlipToLastPage){ total = Math.max(1,total-1); }
          var target = dir==='prev' ? clamp(cur-1,1,total) : clamp(cur+1,1,total);
          if(window.gotoPageFun) gotoPageFun(target, false, 'inline-nav-gp');
        }catch(e){}
      }
      function mount(){
        var row = document.getElementById(targetId);
        if(!row || row.__inline_nav_mounted) return;
        var wrap = document.createElement('div');
        wrap.id = '__inline_nav_gpUwRogPvr';
        var prev = document.createElement('button'); prev.type='button'; prev.className='inline-nav-btn'; prev.setAttribute('aria-label','Previous page'); prev.innerHTML='&lt;';
        var next = document.createElement('button'); next.type='button'; next.className='inline-nav-btn'; next.setAttribute('aria-label','Next page'); next.innerHTML='&gt;';
        prev.addEventListener('click', nav.bind(null,'prev'));
        next.addEventListener('click', nav.bind(null,'next'));
        prev.addEventListener('touchend', nav.bind(null,'prev'), {passive:false});
        next.addEventListener('touchend', nav.bind(null,'next'), {passive:false});
        prev.addEventListener('keydown', function(ev){ if(ev && (ev.key==='Enter'||ev.key===' '||ev.keyCode===13||ev.keyCode===32)) nav('prev', ev); });
        next.addEventListener('keydown', function(ev){ if(ev && (ev.key==='Enter'||ev.key===' '||ev.keyCode===13||ev.keyCode===32)) nav('next', ev); });
        wrap.appendChild(prev); wrap.appendChild(next);
        try{ row.parentNode.insertBefore(wrap, row); row.__inline_nav_mounted = 1; }catch(e){}
      }
      function go(){ if(ready()) mount(); else setTimeout(go, 250); }
      go();
      try{
        var mo = new MutationObserver(function(){ if(ready()) mount(); });
        mo.observe(document.documentElement || document.body, {childList:true, subtree:true});
      }catch(e){}
    })();
  </script>
  <!-- Bind specific data-id buttons: prev/next -->
  <style>
    [data-id="gOFIZFY6p9"], [data-id="gbgCxTBZQN"] { cursor: pointer; }
  </style>
  <script type="text/javascript">
    (function wireSpecificPrevNext(){
      var prevSel = '[data-id="gOFIZFY6p9"]';
      var nextSel = '[data-id="gbgCxTBZQN"]';
      function ready(){
        return window.BookInfo && typeof BookInfo.getCurrentPageIndex === 'function' && typeof window.gotoPageFun === 'function';
      }
      function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
      function nav(dir, ev){
        try{ if(ev){ ev.preventDefault(); ev.stopPropagation(); } }catch(e){}
        try{
          var cur = (BookInfo.getCurrentPageIndex && BookInfo.getCurrentPageIndex()) || 1;
          var total = (window.bookConfig && window.bookConfig.totalPageCount) || 1;
          if(window.bookType===1 && window.bookConfig && window.bookConfig.SingleModeBanFlipToLastPage){ total = Math.max(1,total-1); }
          var target = dir==='prev' ? clamp(cur-1,1,total) : clamp(cur+1,1,total);
          if(window.gotoPageFun) gotoPageFun(target, false, 'data-id-nav');
        }catch(e){}
      }
      function attach(root){
        try{
          root.querySelectorAll(prevSel).forEach(function(el){
            if(el.__flip_prev_bound) return; el.__flip_prev_bound = 1;
            try{ el.style.pointerEvents = 'auto'; }catch(e){}
            el.addEventListener('click', nav.bind(null,'prev'));
            el.addEventListener('touchend', nav.bind(null,'prev'), {passive:false});
            el.addEventListener('keydown', function(ev){ if(ev && (ev.key==='Enter'||ev.key===' '||ev.keyCode===13||ev.keyCode===32)) nav('prev', ev); });
          });
        }catch(e){}
        try{
          root.querySelectorAll(nextSel).forEach(function(el){
            if(el.__flip_next_bound) return; el.__flip_next_bound = 1;
            try{ el.style.pointerEvents = 'auto'; }catch(e){}
            el.addEventListener('click', nav.bind(null,'next'));
            el.addEventListener('touchend', nav.bind(null,'next'), {passive:false});
            el.addEventListener('keydown', function(ev){ if(ev && (ev.key==='Enter'||ev.key===' '||ev.keyCode===13||ev.keyCode===32)) nav('next', ev); });
          });
        }catch(e){}
      }
      function delegate(ev){
        try{
          var t = ev.target.closest && (ev.target.closest(prevSel) || ev.target.closest(nextSel));
          if(!t) return;
          nav(t.matches(prevSel)?'prev':'next', ev);
        }catch(e){}
      }
      function boot(){
        if(!ready()) { setTimeout(boot, 250); return; }
        attach(document);
        try{
          var mo = new MutationObserver(function(){ attach(document); });
          mo.observe(document.documentElement || document.body, {childList:true, subtree:true});
        }catch(e){}
        document.addEventListener('click', delegate, true);
        document.addEventListener('touchend', delegate, {capture:true, passive:false});
      }
      boot();
    })();
  </script>

  <!-- Remove tmpContainer wrapper and alias to body (vanilla + jQuery fallback) -->
  <style>#tmpContainer,.tmpContainer{display:none!important;}</style>
  <script type="text/javascript">
    (function removeTmpContainer(){
      function ready(){ return window.tmpContainer && window.bookContainer; }
      function runVanilla(){
        try{
          var tmp = document.getElementById('tmpContainer');
          var book = document.getElementById('bookContainer');
          if(book){ document.body.appendChild(book); }
          if(tmp && tmp.parentNode){ tmp.parentNode.removeChild(tmp); }
        }catch(e){}
      }
      function run(){
        try{
          var $ = window.jQuery || window.$;
          if($ && window.tmpContainer && window.bookContainer){
            var $tmp = window.tmpContainer, $book = window.bookContainer;
            if($book && $book.length) { $book.detach().appendTo(document.body); }
            if($tmp && $tmp.length) { $tmp.remove(); }
            window.tmpContainer = $(document.body);
          } else {
            runVanilla();
            if(window.jQuery){ window.tmpContainer = window.jQuery(document.body); }
          }
        }catch(e){ runVanilla(); }
      }
      (function wait(){ if(ready()){ setTimeout(run, 0); } else { setTimeout(wait, 150); } })();
    })();
  </script>

  <!-- Allow parent page control via postMessage (prev/next/goto) -->
  <script type="text/javascript">
    (function enablePostMessageControl(){
      function ready(){
        return window.bookConfig && window.BookInfo &&
               typeof BookInfo.getCurrentPageIndex==='function' &&
               typeof window.gotoPageFun==='function';
      }
      function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
      function handleNav(data){
        try{
          var cur = (BookInfo.getCurrentPageIndex && BookInfo.getCurrentPageIndex()) || 1;
          var total = (window.bookConfig && window.bookConfig.totalPageCount) || 1;
          if(window.bookType===1 && window.bookConfig && window.bookConfig.SingleModeBanFlipToLastPage){ total = Math.max(1,total-1); }
          var target = cur;
          if(typeof data.page === 'number') target = clamp(data.page,1,total);
          else if(data.dir === 'prev') target = clamp(cur-1,1,total);
          else if(data.dir === 'next') target = clamp(cur+1,1,total);
          if(window.gotoPageFun && target !== cur) gotoPageFun(target, false, 'postMessage');
        }catch(e){}
      }
      window.addEventListener('message', function(ev){
        try{
          var data = ev && ev.data; if(!data || data.type !== 'flipbook-nav') return;
          if(!ready()){ setTimeout(function(){ if(ready()) handleNav(data); }, 250); return; }
          handleNav(data);
        }catch(e){}
      });
    })();
  </script>
