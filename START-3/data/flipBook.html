  <!-- Force-enable fbBoardBar on mobile by un-hiding and ensuring pointer events -->
  <script type="text/javascript">
    (function ensureBoardBarVisible(){
      var el = document.querySelector('.fbBoardBar');
      if (el) {
        el.style.display = 'block';
        el.style.visibility = 'visible';
        el.style.pointerEvents = 'auto';
        if (window.innerWidth <= 900) { el.style.zIndex = '1002'; }
      }
      setTimeout(ensureBoardBarVisible, 500);
    })();
  </script>
  <!-- Ensure pageBar (page number input) is visible on mobile -->
  <script type="text/javascript">
    (function ensurePageBarVisible(){
      var pb = document.querySelector('.pageBar');
      if (pb) {
        pb.style.display = 'block';
        pb.style.visibility = 'visible';
        pb.style.pointerEvents = 'auto';
        // Attempt to bring its container (bottom bar) into view
        var parent = pb.parentElement;
        if (parent) {
          parent.style.display = 'block';
          parent.style.visibility = 'visible';
          parent.style.pointerEvents = 'auto';
          parent.style.transform = 'translate(0,0)';
          if (window.innerWidth <= 900) parent.style.zIndex = '1001';
        }
      }
      setTimeout(ensurePageBarVisible, 500);
    })();
  </script>

  <!-- Mobile-friendly page bar (new overlay) -->
  <style>
    .mobile-pagebar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:8px 60px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.25);z-index:1005;background:rgba(0,0,0,0.6)}
    /* Desktop-like circular buttons */
    .mobile-pagebar .mpb-btn{
      -webkit-user-select:none; user-select:none;
      visibility: visible !important; pointer-events: auto !important;
      box-sizing: content-box;
      position: absolute; width:40px; height:40px; border-radius:50%;
      background: rgb(238,238,238); display:block; cursor:pointer;
      top: -5px;
    }
    .mobile-pagebar #mpbPrev{ left:4px; }
    .mobile-pagebar #mpbNext{ right:4px; }
    .mobile-pagebar .mpb-btn .icon{width:20px;height:20px;display:block}
    .mobile-pagebar .mpb-field{display:flex;align-items:center;gap:8px}
    .mobile-pagebar input{width:72px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.12);color:#fff;text-align:center;font-size:14px;box-shadow:inset 0 1px 2px rgba(0,0,0,0.35)}
    .mobile-pagebar .of-total{font-size:13px;opacity:0.9}
    @media (max-width: 900px){ .mobile-pagebar{display:flex} }
  </style>
  <div id="mobilePageBar" class="mobile-pagebar" aria-label="Mobile page controls">
    <button type="button" id="mpbPrev" class="mpb-btn" aria-label="Previous page"><img class="icon" alt="Prev"></button>
    <div class="mpb-field">
      <input type="number" id="mpbInput" min="1" step="1" inputmode="numeric" aria-label="Current page" />
      <span class="of-total" id="mpbTotal"></span>
    </div>
    <button type="button" id="mpbNext" class="mpb-btn" aria-label="Next page"><img class="icon" alt="Next"></button>
  </div>
  <script type="text/javascript">
    (function initMobilePageBar(){
      function isMobile(){return /mobile|phone|android|iphone|ipad/i.test(navigator.userAgent) || /(^|[?&])phone(book)?=true(&|$)/i.test(location.search)}
      var bar=document.getElementById('mobilePageBar');
      var prev=document.getElementById('mpbPrev');
      var next=document.getElementById('mpbNext');
      var input=document.getElementById('mpbInput');
      var totalEl=document.getElementById('mpbTotal');
      if(!bar) return;

      function getTotal(){
        try{
          var t=window.bookConfig&&window.bookConfig.totalPageCount||0;
          if(window.bookType===1 && window.bookConfig && window.bookConfig.SingleModeBanFlipToLastPage) return Math.max(1,t-1);
          return t||0;
        }catch(e){return 0}
      }
      function getCurrent(){
        try{ return (window.BookInfo && BookInfo.getCurrentPageIndex && BookInfo.getCurrentPageIndex()) || 1; }catch(e){ return 1 }
      }
      function goto(n){ if(window.gotoPageFun) gotoPageFun(n,false,'mobilePageBar'); }
      function setStyles(){
        try{
          var bg = (window.Color? Color(bookConfig.toolbarColor).rgba(Math.min(bookConfig.bottomToolBarAlpha||bookConfig.ToolBarAlpha||0.9,1)) : (bookConfig.toolbarColor||'#333'));
          var fg = (bookConfig.iconFontColor||'#fff');
          bar.style.background = bg; bar.style.color = fg;
          // icons
          var prevIcon = prev.querySelector('.icon');
          var nextIcon = next.querySelector('.icon');
          var base = (typeof uiBaseURL !== 'undefined' && uiBaseURL) ? uiBaseURL : '';
          if (prevIcon && !prevIcon.getAttribute('src')) prevIcon.src = base + 'previousPage.png';
          if (nextIcon && !nextIcon.getAttribute('src')) nextIcon.src = base + 'nextPage.png';
          input.style.color = fg; input.style.borderColor = fg;
        }catch(e){}
      }
      function sync(){
        var tot=getTotal(); var cur=getCurrent();
        if(tot>0){ totalEl.textContent = '/ '+tot; input.max=tot; }
        if(cur && cur!=parseInt(input.value,10)) input.value = cur;
      }
      function bind(){
        prev.onclick=function(){ var c=getCurrent(); if(c>1) goto(c-1)};
        next.onclick=function(){ var c=getCurrent(); var t=getTotal(); if(c<t) goto(c+1)};
        input.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ var v=parseInt(input.value,10)||1; v=Math.max(1,Math.min(v,getTotal())); goto(v); input.blur(); }});
        input.addEventListener('blur',function(){ var v=parseInt(input.value,10)||getCurrent(); v=Math.max(1,Math.min(v,getTotal())); input.value=v; });
        try{ if(window.BookEvent && BookEvent.bindEvent){ BookEvent.bindEvent('flipPage', function(){ setTimeout(sync,50); }); } }catch(e){}
      }
      function showIfReady(){
        if(!isMobile()) return; // only on mobile
        if(!(window.bookConfig && window.BookInfo && typeof BookInfo.getCurrentPageIndex==='function')){ return setTimeout(showIfReady,300); }
        // Move bar under div.book once it's created
        (function moveUnderBook(){
          var bookEl = document.querySelector('.book');
          if(bookEl && bar.parentNode !== bookEl){ try{ bookEl.appendChild(bar); }catch(e){} }
          if(!bookEl) setTimeout(moveUnderBook, 250);
        })();
        setStyles(); sync(); bind(); bar.style.display='flex';
        setInterval(sync, 800);
      }
      showIfReady();
    })();
  </script>

  <!-- Auto-hide desktop and mobile fullscreen prompts after 3 seconds -->
  <script type="text/javascript">
    (function watchAndHidePrompts() {
      var nodes = document.querySelectorAll('.clickToRead, .miniFullscreen, #miniFullscreen');
      Array.prototype.forEach.call(nodes, function (el) {
        if (el && !el.getAttribute('data-auto-hide-scheduled')) {
          el.setAttribute('data-auto-hide-scheduled', '1');
          setTimeout(function () {
            if (!el || !el.parentNode) return;
            try {
              el.style.transition = 'opacity 300ms ease';
              el.style.opacity = '0';
              setTimeout(function(){ if (el && el.parentNode) el.parentNode.removeChild(el); }, 350);
            } catch (e) {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }
          }, 3000);
        }
      });
      setTimeout(watchAndHidePrompts, 300);
    })();
  </script>
