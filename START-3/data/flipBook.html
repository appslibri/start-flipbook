  <!-- Bind custom prev/next buttons by data-id -->
  <style>
    /* Only show pointer cursor on small/mobile screens */
    @media (max-width: 900px) {
      [data-id="gDFEK4HH8v"], [data-id="g3MM8YDrZ8"], #gDFEK4HH8v, #g3MM8YDrZ8 { cursor: pointer; }
    }
  </style>
  <script type="text/javascript">
    (function wireFlipbookButtons(){
      function isMobile(){
        return /mobile|phone|android|iphone|ipad/i.test(navigator.userAgent)
               || /(^|[?&])phone(book)?=true(&|$)/i.test(location.search);
      }
      if(!isMobile()) return; // bind only on mobile
      var prevSel = '[data-id="gDFEK4HH8v"], #gDFEK4HH8v, [dataid="gDFEK4HH8v"]';
      var nextSel = '[data-id="g3MM8YDrZ8"], #g3MM8YDrZ8, [dataid="g3MM8YDrZ8"]';
      var seen = new WeakSet();
      function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
      function attach(el, type){
        if(!el || seen.has(el)) return;
        seen.add(el);
        // Ensure the element can host a full-size button overlay
        try{
          var cs = window.getComputedStyle(el);
          if(cs && cs.position === 'static'){ el.style.position = 'relative'; }
          el.style.pointerEvents = 'auto';
        }catch(e){}
        // Create or reuse an internal button overlay to capture taps
        var btn = el.querySelector(':scope > button.__flip_nav_btn');
        if(!btn){
          btn = document.createElement('button');
          btn.type = 'button';
          btn.className = '__flip_nav_btn';
          btn.setAttribute('aria-label', type==='prev'?'Previous page':'Next page');
          // desktop UA still bypasses earlier isMobile() return, so this only affects mobile
          Object.assign(btn.style, {
            position:'absolute', left:'0', top:'0', width:'100%', height:'100%',
            background:'transparent', border:'0', padding:'0', margin:'0',
            cursor:'pointer', zIndex:'1000', pointerEvents:'auto'
          });
          el.appendChild(btn);
        }
        var handler = function(ev){
          try{ if(ev){ ev.preventDefault(); ev.stopPropagation(); } }catch(e){}
          try{
            var cur = (window.BookInfo && BookInfo.getCurrentPageIndex && BookInfo.getCurrentPageIndex()) || 1;
            var total = (window.bookConfig && window.bookConfig.totalPageCount) || 1;
            if(window.bookType===1 && window.bookConfig && window.bookConfig.SingleModeBanFlipToLastPage){ total = Math.max(1,total-1); }
            var target = type==='prev' ? clamp(cur-1,1,total) : clamp(cur+1,1,total);
            if(window.gotoPageFun) gotoPageFun(target, false, 'data-id-buttons');
          }catch(e){}
        };
        // Bind to the overlay button for better reliability on mobile browsers
        btn.addEventListener('click', handler);
        btn.addEventListener('touchend', handler, {passive:false});
        btn.addEventListener('pointerup', handler);
        btn.addEventListener('keydown', function(ev){ if(ev && (ev.key==='Enter'||ev.key===' '||ev.keyCode===13||ev.keyCode===32)) handler(ev); });
      }
      // Event delegation fallback: catch taps/clicks bubbling from targets
      try {
        document.addEventListener('click', function(ev){
          try{
            var tPrev = ev.target.closest(prevSel);
            var tNext = ev.target.closest(nextSel);
            if(!tPrev && !tNext) return;
            ev.preventDefault(); ev.stopPropagation();
            var cur = (window.BookInfo && BookInfo.getCurrentPageIndex && BookInfo.getCurrentPageIndex()) || 1;
            var total = (window.bookConfig && window.bookConfig.totalPageCount) || 1;
            if(window.bookType===1 && window.bookConfig && window.bookConfig.SingleModeBanFlipToLastPage){ total = Math.max(1,total-1); }
            var target = tPrev ? clamp(cur-1,1,total) : clamp(cur+1,1,total);
            if(window.gotoPageFun) gotoPageFun(target, false, 'data-id-buttons');
          }catch(e){}
        }, true);
        document.addEventListener('touchend', function(ev){
          try{
            var el = ev.target;
            var tPrev = el.closest && el.closest(prevSel);
            var tNext = el.closest && el.closest(nextSel);
            if(!tPrev && !tNext) return;
            ev.preventDefault(); ev.stopPropagation();
            var cur = (window.BookInfo && BookInfo.getCurrentPageIndex && BookInfo.getCurrentPageIndex()) || 1;
            var total = (window.bookConfig && window.bookConfig.totalPageCount) || 1;
            if(window.bookType===1 && window.bookConfig && window.bookConfig.SingleModeBanFlipToLastPage){ total = Math.max(1,total-1); }
            var target = tPrev ? clamp(cur-1,1,total) : clamp(cur+1,1,total);
            if(window.gotoPageFun) gotoPageFun(target, false, 'data-id-buttons');
          }catch(e){}
        }, {capture:true, passive:false});
      } catch(e) {}

      function scan(){
        try{ document.querySelectorAll(prevSel).forEach(function(el){ attach(el,'prev'); }); }catch(e){}
        try{ document.querySelectorAll(nextSel).forEach(function(el){ attach(el,'next'); }); }catch(e){}
        setTimeout(scan, 800);
      }
      (function wait(){ if(window.bookConfig && window.BookInfo && typeof BookInfo.getCurrentPageIndex==='function' && typeof window.gotoPageFun==='function'){ scan(); } else { setTimeout(wait, 300); } })();
    })();
  </script>

  <!-- Auto-hide desktop and mobile fullscreen prompts after 3 seconds -->
  <script type="text/javascript">
    (function watchAndHidePrompts() {
      var nodes = document.querySelectorAll('.clickToRead, .miniFullscreen, #miniFullscreen');
      Array.prototype.forEach.call(nodes, function (el) {
        if (el && !el.getAttribute('data-auto-hide-scheduled')) {
          el.setAttribute('data-auto-hide-scheduled', '1');
          setTimeout(function () {
            if (!el || !el.parentNode) return;
            try {
              el.style.transition = 'opacity 300ms ease';
              el.style.opacity = '0';
              setTimeout(function(){ if (el && el.parentNode) el.parentNode.removeChild(el); }, 350);
            } catch (e) {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }
          }, 3000);
        }
      });
      setTimeout(watchAndHidePrompts, 300);
    })();
  </script>

  <!-- Mobile left/right overlay navigation (ID-agnostic) -->
  <style>
    @media (max-width: 900px) {
      #__mobile_nav_overlay { position: fixed; inset: 0; z-index: 1001; pointer-events: none; }
      #__mobile_nav_overlay .zone { position: absolute; top: 0; width: 38%; height: 100%; pointer-events: auto; background: transparent; border: 0; }
      #__mobile_nav_overlay .zone.left { left: 0; }
      #__mobile_nav_overlay .zone.right { right: 0; }
      /* keep a small safe area at bottom for toolbars if present */
      @supports (inset: 0) {
        #__mobile_nav_overlay { inset: 0 0 56px 0; }
      }
    }
  </style>
  <script type="text/javascript">
    (function addMobileOverlayNav(){
      function isMobile(){ return /mobile|phone|android|iphone|ipad/i.test(navigator.userAgent)
               || /(^|[?&])phone(book)?=true(&|$)/i.test(location.search); }
      if(!isMobile()) return;
      function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
      function ready(){
        return window.bookConfig && window.BookInfo &&
               typeof BookInfo.getCurrentPageIndex==='function' &&
               typeof window.gotoPageFun==='function';
      }
      function mount(){
        if(document.getElementById('__mobile_nav_overlay')) return; // already mounted
        var wrap = document.createElement('div');
        wrap.id = '__mobile_nav_overlay';
        var left = document.createElement('button'); left.type='button'; left.className='zone left'; left.setAttribute('aria-label','Previous page');
        var right = document.createElement('button'); right.type='button'; right.className='zone right'; right.setAttribute('aria-label','Next page');
        var handler = function(dir){ return function(ev){
          try{ if(ev){ ev.preventDefault(); ev.stopPropagation(); } }catch(e){}
          try{
            var cur = (BookInfo.getCurrentPageIndex && BookInfo.getCurrentPageIndex()) || 1;
            var total = (window.bookConfig && window.bookConfig.totalPageCount) || 1;
            if(window.bookType===1 && window.bookConfig && window.bookConfig.SingleModeBanFlipToLastPage){ total = Math.max(1,total-1); }
            var target = dir==='prev' ? clamp(cur-1,1,total) : clamp(cur+1,1,total);
            if(window.gotoPageFun) gotoPageFun(target, false, 'mobile-overlay');
          }catch(e){}
        }; };
        left.addEventListener('click', handler('prev'));
        right.addEventListener('click', handler('next'));
        left.addEventListener('touchend', handler('prev'), {passive:false});
        right.addEventListener('touchend', handler('next'), {passive:false});
        wrap.appendChild(left); wrap.appendChild(right);
        document.body.appendChild(wrap);
      }
      (function wait(){ if(ready()){ mount(); } else { setTimeout(wait, 300); } })();
    })();
  </script>
